[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-robotics"
dynamic = ["version"]
description = "Automatic Differentiation for rigid-body-dynamics AlgorithMs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Giuseppe L'Erario", email = "gl.giuseppelerario@gmail.com" },
]
requires-python = ">=3.10"
keywords = [
  "robotics",
  "urdf",
  "rigid body dynamics",
  "featherstone",
  "automatic differentiation",
  "optimization",
  "casadi",
  "jax",
  "pytorch",
  "reinforcement-learning",
  "motion-planning",
]
dependencies = [
  "numpy>=1.20",
  "scipy",
  "casadi>=3.6",
  "prettytable",
  "urdfdom-py",
  "array-api-compat",
]

[project.optional-dependencies]
jax = ["jax", "jaxlib"]
casadi = ["casadi", "liecasadi"]
pytorch = ["torch", "jax", "jaxlib"]
mujoco = ["mujoco"]
usd = ["usd-core", "trimesh"]
visualization = ["viser", "trimesh"]
test = [
  "jax",
  "jaxlib",
  "casadi",
  "torch",
  "viser",
  "trimesh",
  "urdf-usd-converter",
  "mujoco",
  "robot_descriptions",
  "pytest",
  "idyntree",
  "icub-models",
  "black",
  "requests",
  "liecasadi",
]
conversion = ["idyntree"]
all = ["jax", "jaxlib", "casadi>=3.6", "torch", "viser", "trimesh"]

[project.urls]
"Documentation" = "https://adam-robotics.readthedocs.io/en/latest/"
"Source" = "https://github.com/ami-iit/adam"

[project.scripts]
adam-model-view = "adam.visualization.cli:main"

# Benchmark/test environments (uv only, not part of the published package):
#   uv run --group bench-cpu python benchmarks/benchmark_dynamics.py ...
#   uv run --group bench-gpu python benchmarks/benchmark_dynamics.py --device cuda ...
#   uv run --group bench-gpu pytest tests/test_batched_api.py
[dependency-groups]
bench-cpu = ["torch", "jax", "icub-models", "pytest", "idyntree", "requests"]
bench-gpu = ["torch", "jax[cuda13]", "icub-models", "pytest", "idyntree", "requests"]

[tool.uv]
conflicts = [[{ group = "bench-cpu" }, { group = "bench-gpu" }]]
# urdf-usd-converter (test extra) only works with a tinyobjloader pre-release
constraint-dependencies = ["tinyobjloader>=2.0.0rc13"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "bench-cpu" },
  { index = "pytorch-cu130", group = "bench-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools_scm]
local_scheme = "dirty-tag"

[tool.setuptools]
package-dir = { "" = "src" } # keeps the src/ layout

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
src = ["src"]

[tool.pytest.ini_options]
addopts = "--capture=no --verbose"
testpaths = ["tests"]
